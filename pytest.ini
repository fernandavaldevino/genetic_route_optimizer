[pytest]
# Diretórios onde procurar testes
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py

# Padrões de classes de teste
python_classes = Test*

# Padrões de funções de teste
python_functions = test_*

# Opções padrão para pytest
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marcadores personalizados
markers =
    slow: marca testes que demoram mais tempo
    integration: marca testes de integração (requerem API keys e conexão)
    unit: marca testes unitários
    streamlit: marca testes relacionados ao Streamlit
    llm: marca testes relacionados a provedores LLM

# Configuração de cobertura
[coverage:run]
source = src
omit = 
    */tests/*
    */visualization/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
